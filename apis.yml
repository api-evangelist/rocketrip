name: Rocketrip
description: Rocketrip was a New York City corporate travel cost-savings platform that gave business
  travelers a personalized budget (a "Price to Beat") and rewarded employees who booked flights, hotels,
  and rail below it, sharing the savings between the traveler and the company. It was backed by Canaan
  Partners, GV, Bessemer, and Y Combinator. As of this enrichment pass the rocketrip.com and
  www.rocketrip.com domains 301-redirect to Tabhi (tabhi.ai / tabhi.com), the developer, docs, and api
  subdomains no longer resolve, and no public API, developer portal, or OpenAPI could be found — the
  standalone Rocketrip product and its API surface appear to have been retired or folded into Tabhi.
